swiperefreshlayout = "1.1.0"
fragmentKtx = "1.8.5"
navigationKtx = "2.8.5"
lifecycleKtx = "2.8.7"
coil = "2.7.0"
coroutines = "1.9.0"
junit = "4.13.2"
